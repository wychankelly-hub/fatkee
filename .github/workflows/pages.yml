name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate content (must print 全部通過)
        run: python3 build.py
      - name: Check levels.json is up to date
        run: git diff --exit-code levels.json
      - name: Unit tests (JS checker)
        run: npm ci && npm test
      - name: Collect site files
        run: |
          mkdir -p _site/data
          cp -r index.html teacher.html developer.html manifest.json sw.js levels.json css js vendor icons _site/
          cp data/data_a.sql data/patch_b.sql _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

